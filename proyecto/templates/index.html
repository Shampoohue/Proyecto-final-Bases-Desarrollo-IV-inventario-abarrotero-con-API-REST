<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Categorías y Artículos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Sistema de Gestión de Inventario</h1>

        <section class="section">
            <h2>Artículos</h2>
            <div class="form-card">
                <h3 id="articleFormTitle">Agregar Nuevo Artículo</h3>
                <form id="articleForm">
                    <input type="hidden" id="articleId" value="">
                    <div class="form-group">
                        <label for="articleNombre">Nombre:</label>
                        <input type="text" id="articleNombre" required>
                    </div>
                    <div class="form-group">
                        <label for="articlePrecio">Precio:</label>
                        <input type="number" id="articlePrecio" step="0.01" required placeholder="solo dos decimales por favor">
                    </div>
                    <div class="form-group">
                        <label for="articleStock">Stock:</label>
                        <input type="number" id="articleStock" required>
                    </div>
                    <div class="form-group">
                        <label for="articleCategoria">Categoría:</label>
                        <select id="articleCategoria">
                            <option value="">-- Sin categoría --</option>
                        </select>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" id="articleSubmitBtn">Crear Artículo</button>
                        <button type="button" id="cancelArticleBtn" class="cancel-btn">Cancelar Edición</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <h3>Lista de Artículos</h3>
                <table id="articlesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="articlesTableBody">
                        <tr><td colspan="6">Cargando artículos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="section">
            <h2>Categorías</h2>
            <div class="form-card">
                <h3 id="categoryFormTitle">Agregar Nueva Categoría</h3>
                <form id="categoryForm">
                    <input type="hidden" id="categoryId" value="">
                    <div class="form-group">
                        <label for="categoryNombre">Nombre:</label>
                        <input type="text" id="categoryNombre" required>
                    </div>
                    <div class="form-group">
                        <label for="categoryDescripcion">Descripción:</label>
                        <input type="text" id="categoryDescripcion" placeholder="una breve descripción (opcional)">
                    </div>
                    <div class="form-buttons">
                        <button type="submit" id="categorySubmitBtn">Crear Categoría</button>
                        <button type="button" id="cancelCategoryBtn" class="cancel-btn">Cancelar Edición</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <h3>Lista de Categorías</h3>
                <table id="categoriesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody">
                        <tr><td colspan="4">Cargando categorías...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
